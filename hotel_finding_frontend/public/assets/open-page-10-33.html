<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Page - 10:33</title>
  <meta name="viewport" content="width=411, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./open-page-10-33.css">
</head>
<body>
  <div id="screen_open-page_10_33" class="screen-container open-page-10-33" role="main" aria-label="Open Page">
    <!-- Root frame background image -->
    <img class="root-bg" src="figmaimages/figma_image_10_33.png" alt="Open Page Background">

    <!-- Text: Welcome to, Hotel Finder -->
    <p id="el-10-34">Welcome to,

Hotel Finder</p>

    <!-- Icon container: carbon:next-outline -->
    <div id="el-10-35" aria-label="carbon:next-outline">
      <img id="el-10-36" src="figmaimages/figma_image_10_36.svg" alt="Vector" />
      <img id="el-10-37" src="figmaimages/figma_image_10_37.svg" alt="Vector" />
    </div>

    <!-- Body text -->
    <p id="el-10-38">We have best in class

Recommandations of hotels distributed in all across India.</p>

    <!-- Status Bar component -->
    <div id="el-10-316" aria-label="Status Bar">
      <p class="time">9:41 AM</p>

      <div class="right-side" aria-label="Right Side">
        <div class="battery" aria-label="Battery">
          <img class="path-1" src="figmaimages/figma_image_10_316_36_9156.svg" alt="Battery Body" />
          <img class="path-2" src="figmaimages/figma_image_10_316_36_9157.svg" alt="Battery Fill" />
          <!-- Terminal and Reserve are vector icons without imagePath; render as precise sized placeholders -->
          <div class="terminal" aria-hidden="true"></div>
          <div class="reserve" aria-hidden="true"></div>
        </div>
        <p class="percent">100%</p>
        <div class="alarm" aria-label="Alarm"></div>
        <div class="bluetooth" aria-label="Bluetooth"></div>
      </div>

      <div class="left-side" aria-label="Left Side">
        <div class="mobile-signal" aria-label="Mobile Signal">
          <img class="signal" src="figmaimages/figma_image_10_316_140_8816.svg" alt="Signal" />
        </div>
        <p class="carrier">Figma</p>
        <div class="wifi" aria-label="Wifi">
          <img class="wifi-icon" src="figmaimages/figma_image_10_316_140_8802.svg" alt="Wi–Fi" />
        </div>
      </div>
    </div>

    <!-- Home Indicator component -->
    <div id="el-10-349" aria-label="Home Indicator">
      <div class="home-indicator-bar" aria-hidden="true"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
